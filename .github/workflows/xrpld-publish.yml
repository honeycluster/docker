name: Build and Publish Docker Images for XRPLD
description: Build and publish the XRPLD build Docker images (base and slim)

on:
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # Base image (built from source with envsubst templates)
  DOCKER_IMAGE_BASE: ${{ secrets.DOCKER_ORG }}/xrpld
  GHCR_IMAGE_BASE: xrpld
  # Slim image (built from source with static config)
  DOCKER_IMAGE_SLIM: ${{ secrets.DOCKER_ORG }}/xrpld-slim
  GHCR_IMAGE_SLIM: xrpld-slim
  BUILD_CONTEXT: ./src/xrpld

jobs:
  fetch-rippled-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.rippled-tag.outputs.tag }}
      is_prerelease: ${{ steps.rippled-tag.outputs.is_prerelease }}
    steps:
      - name: Fetch latest rippled release tag (including pre-releases)
        id: rippled-tag
        run: |
          set -euo pipefail

          LATEST_TAG=$(
            curl -s https://api.github.com/repos/XRPLF/rippled/releases \
              | grep -o '"tag_name"[[:space:]]*:[[:space:]]*"[^"]*"' \
              | head -1 \
              | sed 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/'
          )
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to fetch from releases, trying tags endpoint..."
            LATEST_TAG=$(
              curl -s https://api.github.com/repos/XRPLF/rippled/tags \
                | grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | head -1 \
                | sed 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/'
            )
          fi
          
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "❌ Failed to fetch rippled tag. Exiting."
            exit 1
          fi
          
          echo "Latest rippled tag: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT

          if echo "$LATEST_TAG" | grep -qE '-(alpha|beta|rc|pre|dev|snapshot)'; then
            echo "⚠️  Pre-release tag detected"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Stable release tag"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  check-existing-tags:
    runs-on: ubuntu-latest
    needs: fetch-rippled-tag
    outputs:
      skip: ${{ steps.check-tags.outputs.skip }}
    steps:
      - name: Check if tags already exist on Docker Hub
        id: check-tags
        run: |
          set -euo pipefail
          
          TAG="${{ needs.fetch-rippled-tag.outputs.tag }}"
          BASE_URL="https://hub.docker.com/v2/repositories/${DOCKER_IMAGE_BASE}/tags/${TAG}/"
          SLIM_URL="https://hub.docker.com/v2/repositories/${DOCKER_IMAGE_SLIM}/tags/${TAG}/"

          BASE_EXISTS=false
          RESPONSE=$(curl -sSL -w "\nHTTP_CODE:%{http_code}" "$BASE_URL" 2>&1)
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2 || echo "000")
          BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')
          if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -qE '"name"[[:space:]]*:[[:space:]]*"'"${TAG}"'"'; then
            BASE_EXISTS=true
          fi

          SLIM_EXISTS=false
          RESPONSE=$(curl -sSL -w "\nHTTP_CODE:%{http_code}" "$SLIM_URL" 2>&1)
          HTTP_CODE=$(echo "$RESPONSE" | grep "HTTP_CODE:" | cut -d: -f2 || echo "000")
          BODY=$(echo "$RESPONSE" | sed '/HTTP_CODE:/d')
          if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -qE '"name"[[:space:]]*:[[:space:]]*"'"${TAG}"'"'; then
            SLIM_EXISTS=true
          fi

          if [ "$BASE_EXISTS" = true ] && [ "$SLIM_EXISTS" = true ]; then
            echo "✅ Both tags already exist on Docker Hub. Skipping build/publish."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Will build/publish because at least one tag is missing. (base=${BASE_EXISTS}, slim=${SLIM_EXISTS})"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-binary:
    runs-on:
      group: Onprem
    needs: [fetch-rippled-tag, check-existing-tags]
    if: needs.check-existing-tags.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "rippled_tag=${{ needs.fetch-rippled-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building binary from branch: release (rippled: ${{ needs.fetch-rippled-tag.outputs.tag }})"

      # --- Build binary stage (shared by base and slim) ---
      - name: Build binary stage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: build
          push: false
          build-args: |
            VERSION=${{ needs.fetch-rippled-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=xrpld-build-${{ needs.fetch-rippled-tag.outputs.tag }}
          cache-to: |
            type=gha,mode=max,scope=build,key=xrpld-build-${{ needs.fetch-rippled-tag.outputs.tag }}

  build-and-push-base:
    runs-on: ubuntu-latest
    needs: [fetch-rippled-tag, check-existing-tags, build-binary]
    if: needs.check-existing-tags.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "rippled_tag=${{ needs.fetch-rippled-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building base image from branch: release with tag: nightly (rippled: ${{ needs.fetch-rippled-tag.outputs.tag }})"

      - name: Prepare tags for base
        id: tags-base
        run: |
          TAGS="type=raw,value=${{ needs.fetch-rippled-tag.outputs.tag }}"
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" != "true" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Publish base image (built from source) ---
      - name: Extract metadata for base (Docker Hub)
        id: meta-docker-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BASE }}
          tags: ${{ steps.tags-base.outputs.tags }}

      - name: Extract metadata for base (GHCR)
        id: meta-ghcr-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}
          tags: ${{ steps.tags-base.outputs.tags }}


      - name: Build and push base image
        id: build-base
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.meta-docker-base.outputs.tags }}
            ${{ steps.meta-ghcr-base.outputs.tags }}
          labels: ${{ steps.meta-docker-base.outputs.labels }}
          build-args: |
            VERSION=${{ needs.fetch-rippled-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=xrpld-build-${{ needs.fetch-rippled-tag.outputs.tag }}
          cache-to: |
            type=gha,mode=max,scope=build,key=xrpld-build-${{ needs.fetch-rippled-tag.outputs.tag }}

  build-and-push-slim:
    runs-on: ubuntu-latest
    needs: [fetch-rippled-tag, check-existing-tags, build-binary]
    if: needs.check-existing-tags.outputs.skip != 'true'
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "rippled_tag=${{ needs.fetch-rippled-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building slim image from branch: release with tag: nightly (rippled: ${{ needs.fetch-rippled-tag.outputs.tag }})"

      - name: Prepare tags for slim
        id: tags-slim
        run: |
          TAGS="type=raw,value=${{ needs.fetch-rippled-tag.outputs.tag }}"
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" != "true" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Publish slim image (built from source) ---
      - name: Extract metadata for slim (Docker Hub)
        id: meta-docker-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_SLIM }}
          tags: ${{ steps.tags-slim.outputs.tags }}

      - name: Extract metadata for slim (GHCR)
        id: meta-ghcr-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}
          tags: ${{ steps.tags-slim.outputs.tags }}

      - name: Build and push slim image
        id: build-slim
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: slim
          push: true
          tags: |
            ${{ steps.meta-docker-slim.outputs.tags }}
            ${{ steps.meta-ghcr-slim.outputs.tags }}
          labels: ${{ steps.meta-docker-slim.outputs.labels }}
          build-args: |
            VERSION=${{ needs.fetch-rippled-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=xrpld-build-${{ needs.fetch-rippled-tag.outputs.tag }}
          cache-to: |
            type=gha,mode=max,scope=build,key=xrpld-build-${{ needs.fetch-rippled-tag.outputs.tag }}

  summary:
    runs-on: ubuntu-latest
    needs: [fetch-rippled-tag, build-binary, build-and-push-base, build-and-push-slim]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PRERELEASE_INFO=""
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_INFO=" (Pre-release)"
          fi
          echo "**Rippled Version:** \`${{ needs.fetch-rippled-tag.outputs.tag }}\`$PRERELEASE_INFO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Base (xrpld)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          LATEST_TAG=""
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" != "true" ]; then
            LATEST_TAG="<br>\`${{ env.DOCKER_IMAGE_BASE }}:latest\`"
          fi
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_BASE }}:${{ needs.fetch-rippled-tag.outputs.tag }}\`$LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          GHCR_LATEST_TAG=""
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" != "true" ]; then
            GHCR_LATEST_TAG="<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}:latest\`"
          fi
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}:${{ needs.fetch-rippled-tag.outputs.tag }}\`$GHCR_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-base.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Slim (xrpld-slim)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          SLIM_LATEST_TAG=""
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" != "true" ]; then
            SLIM_LATEST_TAG="<br>\`${{ env.DOCKER_IMAGE_SLIM }}:latest\`"
          fi
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_SLIM }}:${{ needs.fetch-rippled-tag.outputs.tag }}\`$SLIM_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          SLIM_GHCR_LATEST_TAG=""
          if [ "${{ needs.fetch-rippled-tag.outputs.is_prerelease }}" != "true" ]; then
            SLIM_GHCR_LATEST_TAG="<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}:latest\`"
          fi
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}:${{ needs.fetch-rippled-tag.outputs.tag }}\`$SLIM_GHCR_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-slim.result }}" >> $GITHUB_STEP_SUMMARY
