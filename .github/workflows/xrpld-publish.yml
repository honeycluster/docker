name: Build and Publish Docker Images for XRPLD
description: Build and publish the base and min XRPLD Docker images

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'release'
        type: choice
        options:
          - develop
          - release
      version:
        description: 'Image tag: "latest" or a version (e.g. 1.0.0, v1.0.0)'
        required: true
        default: 'latest'
        type: string

env:
  DOCKER_REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # Base image (envsubst, templates)
  DOCKER_IMAGE_BASE: ${{ secrets.DOCKER_ORG }}/xrpld
  GHCR_IMAGE_BASE: xrpld
  # Min image (static config, no injection)
  DOCKER_IMAGE_MIN: ${{ secrets.DOCKER_ORG }}/xrpld-slim
  GHCR_IMAGE_MIN: xrpld-min
  BUILD_CONTEXT: ./docker/xrpld

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=${{ github.event.inputs.branch }}" >> $GITHUB_OUTPUT
          echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "Building from branch: ${{ github.event.inputs.branch }} with tag: ${{ github.event.inputs.version }}"

      # --- Publish base image ---
      - name: Extract metadata for base (Docker Hub)
        id: meta-docker-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BASE }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}
            type=raw,value=latest

      - name: Extract metadata for base (GHCR)
        id: meta-ghcr-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_BASE }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}
            type=raw,value=latest

      - name: Build and push base image
        id: build-base
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/base.dockerfile
          push: true
          tags: |
            ${{ steps.meta-docker-base.outputs.tags }}
            ${{ steps.meta-ghcr-base.outputs.tags }}
          labels: ${{ steps.meta-docker-base.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Publish min image ---
      - name: Extract metadata for min (Docker Hub)
        id: meta-docker-min
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_MIN }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}
            type=raw,value=latest

      - name: Extract metadata for min (GHCR)
        id: meta-ghcr-min
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_MIN }}
          tags: |
            type=raw,value=${{ steps.branch.outputs.tag }}
            type=raw,value=latest

      - name: Build and push min image
        id: build-min
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/min.dockerfile
          push: true
          tags: |
            ${{ steps.meta-docker-min.outputs.tags }}
            ${{ steps.meta-ghcr-min.outputs.tags }}
          labels: ${{ steps.meta-docker-min.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Summary ---
      - name: Summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.branch.outputs.branch }}\` | **Tag:** \`${{ steps.branch.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Base (xrpld)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_BASE }}:${{ steps.branch.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_BASE }}:${{ steps.branch.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-base.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Min (xrpld-min)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_MIN }}:${{ steps.branch.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_MIN }}:${{ steps.branch.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-min.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
