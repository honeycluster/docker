name: Build and Publish Docker Images for XRPLD (Nightly)
description: Build and publish the XRPLD base Docker image with nightly tag

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io

  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

  # Base image (built from source)
  DOCKER_IMAGE_BASE: ${{ secrets.DOCKER_ORG }}/xrpld
  GHCR_IMAGE_BASE: xrpld

  BUILD_CONTEXT: ./packages/docker/xrpld

jobs:
  fetch-rippled-develop:
    runs-on: ubuntu-latest
    outputs:
      develop_commit: ${{ steps.rippled-commit.outputs.commit }}
    steps:
      - name: Fetch latest rippled develop branch commit SHA
        id: rippled-commit
        run: |
          set -euo pipefail

          COMMIT_SHA=$(
            curl -s https://api.github.com/repos/XRPLF/rippled/commits/develop \
              | grep -o '"sha"[[:space:]]*:[[:space:]]*"[^"]*"' \
              | head -1 \
              | sed 's/.*"sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/'
          )

          if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" = "null" ]; then
            echo "❌ Failed to fetch rippled develop commit SHA. Exiting."
            exit 1
          fi

          echo "Latest rippled develop commit: $COMMIT_SHA"
          echo "commit=$COMMIT_SHA" >> $GITHUB_OUTPUT

  build-binary:
    runs-on:
      group: Onprem
    needs: [fetch-rippled-develop]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "rippled_commit=${{ needs.fetch-rippled-develop.outputs.develop_commit }}" >> $GITHUB_OUTPUT
          echo "Building binary from branch: develop (rippled develop commit: ${{ needs.fetch-rippled-develop.outputs.develop_commit }})"

      - name: Build binary stage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: build
          push: false
          build-args: |
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=xrpld-build-${{ needs.fetch-rippled-develop.outputs.develop_commit }}
          cache-to: |
            type=gha,mode=max,scope=build,key=xrpld-build-${{ needs.fetch-rippled-develop.outputs.develop_commit }}

  build-and-push-base:
    runs-on: ubuntu-latest
    needs: [fetch-rippled-develop, build-binary]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "rippled_commit=${{ needs.fetch-rippled-develop.outputs.develop_commit }}" >> $GITHUB_OUTPUT
          echo "Building base image from branch: develop with tag: nightly (rippled develop commit: ${{ needs.fetch-rippled-develop.outputs.develop_commit }})"

      - name: Extract metadata for base (Docker Hub)
        id: meta-docker-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BASE }}
          tags: |
            type=raw,value=nightly

      - name: Extract metadata for base (GHCR)
        id: meta-ghcr-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}
          tags: |
            type=raw,value=nightly

      - name: Build and push base image
        id: build-base
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.meta-docker-base.outputs.tags }}
            ${{ steps.meta-ghcr-base.outputs.tags }}
          labels: ${{ steps.meta-docker-base.outputs.labels }}
          build-args: |
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=xrpld-build-${{ needs.fetch-rippled-develop.outputs.develop_commit }}
          cache-to: |
            type=gha,mode=max,scope=build,key=xrpld-build-${{ needs.fetch-rippled-develop.outputs.develop_commit }}

  summary:
    runs-on: ubuntu-latest
    needs:
      [
        fetch-rippled-develop,
        build-binary,
        build-and-push-base,
      ]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Images Published (Nightly)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "**Rippled Develop Commit:** \`${{ needs.fetch-rippled-develop.outputs.develop_commit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Base (xrpld)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_BASE }}:nightly\`<br>\`${{ env.DOCKER_IMAGE_BASE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}:nightly\`<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-base.result }}" >> $GITHUB_STEP_SUMMARY
