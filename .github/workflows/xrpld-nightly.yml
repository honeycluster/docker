name: Build and Publish Docker Images for XRPLD (Nightly)
description: Build and publish the XRPLD build Docker images (base and slim) with nightly tag

on:
  schedule:
    # Run every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  DOCKER_REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  # Base image (built from source with envsubst templates)
  DOCKER_IMAGE_BASE: ${{ secrets.DOCKER_ORG }}/xrpld
  GHCR_IMAGE_BASE: xrpld
  # Slim image (built from source with static config)
  DOCKER_IMAGE_SLIM: ${{ secrets.DOCKER_ORG }}/xrpld-slim
  GHCR_IMAGE_SLIM: xrpld-slim
  BUILD_CONTEXT: ./src/xrpld

jobs:
  build-binary:
    runs-on:
      group: Onprem
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT

      # --- Build binary stage (shared by base and slim) ---
      - name: Build binary stage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: build
          push: false
          build-args: |
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-base:
    runs-on: ubuntu-latest
    needs: [build-binary]
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT

      # --- Publish base image (built from source) ---
      - name: Extract metadata for base (Docker Hub)
        id: meta-docker-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BASE }}
          tags: |
            type=raw,value=nightly

      - name: Extract metadata for base (GHCR)
        id: meta-ghcr-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}
          tags: |
            type=raw,value=nightly

      - name: Build and push base image
        id: build-base
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.meta-docker-base.outputs.tags }}
            ${{ steps.meta-ghcr-base.outputs.tags }}
          labels: ${{ steps.meta-docker-base.outputs.labels }}
          build-args: |
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-slim:
    runs-on: ubuntu-latest
    needs: [build-binary]
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT

      # --- Publish slim image (built from source) ---
      - name: Extract metadata for slim (Docker Hub)
        id: meta-docker-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_SLIM }}
          tags: |
            type=raw,value=nightly

      - name: Extract metadata for slim (GHCR)
        id: meta-ghcr-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}
          tags: |
            type=raw,value=nightly

      - name: Build and push slim image
        id: build-slim
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: slim
          push: true
          tags: |
            ${{ steps.meta-docker-slim.outputs.tags }}
            ${{ steps.meta-ghcr-slim.outputs.tags }}
          labels: ${{ steps.meta-docker-slim.outputs.labels }}
          build-args: |
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    runs-on: ubuntu-latest
    needs: [build-binary, build-and-push-base, build-and-push-slim]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Images Published (Nightly)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Base (xrpld)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_BASE }}:nightly\`<br>\`${{ env.DOCKER_IMAGE_BASE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}:nightly\`<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-base.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Slim (xrpld-slim)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_SLIM }}:nightly\`<br>\`${{ env.DOCKER_IMAGE_SLIM }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}:nightly\`<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}:nightly\` |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-slim.result }}" >> $GITHUB_STEP_SUMMARY
