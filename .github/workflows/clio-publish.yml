name: Build and Publish Docker Images for Clio
description: Build and publish the Clio build Docker images (base, envt, and slim)

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional Clio version/tag (e.g. 2.1.1). Leave empty to use latest from XRPLF/clio.'
        required: false
        type: string

env:
  DOCKER_REGISTRY: docker.io
  GHCR_REGISTRY: ghcr.io
  DOCKER_ORG: ${{ secrets.DOCKER_ORG }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  
  # Base image (built from source)
  DOCKER_IMAGE_BASE: ${{ secrets.DOCKER_ORG }}/clio
  GHCR_IMAGE_BASE: clio
  # Slim image (built from source)
  DOCKER_IMAGE_SLIM: ${{ secrets.DOCKER_ORG }}/clio-slim
  GHCR_IMAGE_SLIM: clio-slim
  # Envt image (built from source with envsubst templates)
  DOCKER_IMAGE_ENVT: ${{ secrets.DOCKER_ORG }}/clio-envt
  GHCR_IMAGE_ENVT: clio-envt

  BUILD_CONTEXT: ./src/clio

jobs:
  fetch-clio-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.clio-tag.outputs.tag }}
      tag_cache_key: ${{ steps.clio-tag.outputs.tag_cache_key }}
      is_prerelease: ${{ steps.clio-tag.outputs.is_prerelease }}
    env:
      INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || '' }}
    steps:
      - name: Resolve Clio version/tag
        id: clio-tag
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION}" ]; then
            echo "Using provided version: ${INPUT_VERSION}"
            LATEST_TAG="${INPUT_VERSION}"
          else
            echo "Fetching latest Clio release tag (including pre-releases)..."
            LATEST_TAG=$(
              curl -s https://api.github.com/repos/XRPLF/clio/releases \
                | grep -o '"tag_name"[[:space:]]*:[[:space:]]*"[^"]*"' \
                | head -1 \
                | sed 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/'
            )
            
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              echo "Failed to fetch from releases, trying tags endpoint..."
              LATEST_TAG=$(
                curl -s https://api.github.com/repos/XRPLF/clio/tags \
                  | grep -o '"name"[[:space:]]*:[[:space:]]*"[^"]*"' \
                  | head -1 \
                  | sed 's/.*"name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/'
              )
            fi
            
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
              echo "❌ Failed to fetch Clio tag. Exiting."
              exit 1
            fi
            echo "Latest Clio tag: $LATEST_TAG"
          fi

          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          TAG_CACHE_KEY=$(printf '%s' "$LATEST_TAG" | base64 -w0)
          echo "tag_cache_key=$TAG_CACHE_KEY" >> $GITHUB_OUTPUT

          if [ -n "${INPUT_VERSION}" ]; then
            echo "⚠️ Provided version - preventing latest tag from being used"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          elif echo "$LATEST_TAG" | grep -qE '^nightly|-(alpha|beta|rc|pre|dev|snapshot|nightly)'; then
            echo "⚠️  Pre-release tag detected"
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "✅ Stable release tag"
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

  build-binary:
    runs-on:
      group: Onprem
    needs: [fetch-clio-tag]
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "clio_tag=${{ needs.fetch-clio-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building binary from branch: release (Clio: ${{ needs.fetch-clio-tag.outputs.tag }})"

      # --- Build binary stage (shared by base and slim) ---
      - name: Build binary stage
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: build
          push: false
          build-args: |
            VERSION=${{ needs.fetch-clio-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}
          cache-to: |
            type=gha,mode=max,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}

  build-and-push-base:
    runs-on: ubuntu-latest
    needs: [fetch-clio-tag, build-binary]
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "clio_tag=${{ needs.fetch-clio-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building base image from branch: release with tag: nightly (Clio: ${{ needs.fetch-clio-tag.outputs.tag }})"

      - name: Prepare tags for base
        id: tags-base
        run: |
          TAGS="type=raw,value=${{ needs.fetch-clio-tag.outputs.tag }}"
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Publish base image (built from source) ---
      - name: Extract metadata for base (Docker Hub)
        id: meta-docker-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_BASE }}
          tags: ${{ steps.tags-base.outputs.tags }}

      - name: Extract metadata for base (GHCR)
        id: meta-ghcr-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}
          tags: ${{ steps.tags-base.outputs.tags }}


      - name: Build and push base image
        id: build-base
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: base
          push: true
          tags: |
            ${{ steps.meta-docker-base.outputs.tags }}
            ${{ steps.meta-ghcr-base.outputs.tags }}
          labels: ${{ steps.meta-docker-base.outputs.labels }}
          build-args: |
            VERSION=${{ needs.fetch-clio-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}
          cache-to: |
            type=gha,mode=max,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}

  build-and-push-envt:
    runs-on: ubuntu-latest
    needs: [fetch-clio-tag, build-binary]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "clio_tag=${{ needs.fetch-clio-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building envt image from branch: release (Clio: ${{ needs.fetch-clio-tag.outputs.tag }})"

      - name: Prepare tags for envt
        id: tags-envt
        run: |
          TAGS="type=raw,value=${{ needs.fetch-clio-tag.outputs.tag }}"
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Extract metadata for envt (Docker Hub)
        id: meta-docker-envt
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_ENVT }}
          tags: ${{ steps.tags-envt.outputs.tags }}

      - name: Extract metadata for envt (GHCR)
        id: meta-ghcr-envt
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_ENVT }}
          tags: ${{ steps.tags-envt.outputs.tags }}

      - name: Build and push envt image
        id: build-envt
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: envt
          push: true
          tags: |
            ${{ steps.meta-docker-envt.outputs.tags }}
            ${{ steps.meta-ghcr-envt.outputs.tags }}
          labels: ${{ steps.meta-docker-envt.outputs.labels }}
          build-args: |
            VERSION=${{ needs.fetch-clio-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}
          cache-to: |
            type=gha,mode=max,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}

  build-and-push-slim:
    runs-on: ubuntu-latest
    needs: [fetch-clio-tag, build-binary]
    permissions:
      contents: read
      packages: write

    steps:
      # --- Shared setup ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set branch and tag
        id: branch
        run: |
          echo "branch=develop" >> $GITHUB_OUTPUT
          echo "tag=nightly" >> $GITHUB_OUTPUT
          echo "clio_tag=${{ needs.fetch-clio-tag.outputs.tag }}" >> $GITHUB_OUTPUT
          echo "Building slim image from branch: release with tag: nightly (Clio: ${{ needs.fetch-clio-tag.outputs.tag }})"

      - name: Prepare tags for slim
        id: tags-slim
        run: |
          TAGS="type=raw,value=${{ needs.fetch-clio-tag.outputs.tag }}"
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            TAGS="$TAGS"$'\n'"type=raw,value=latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # --- Publish slim image (built from source) ---
      - name: Extract metadata for slim (Docker Hub)
        id: meta-docker-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_SLIM }}
          tags: ${{ steps.tags-slim.outputs.tags }}

      - name: Extract metadata for slim (GHCR)
        id: meta-ghcr-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}
          tags: ${{ steps.tags-slim.outputs.tags }}

      - name: Build and push slim image
        id: build-slim
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/images/build.dockerfile
          target: slim
          push: true
          tags: |
            ${{ steps.meta-docker-slim.outputs.tags }}
            ${{ steps.meta-ghcr-slim.outputs.tags }}
          labels: ${{ steps.meta-docker-slim.outputs.labels }}
          build-args: |
            VERSION=${{ needs.fetch-clio-tag.outputs.tag }}
            BRANCH=${{ steps.branch.outputs.branch }}
          cache-from: |
            type=gha,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}
          cache-to: |
            type=gha,mode=max,scope=build,key=clio-build-${{ needs.fetch-clio-tag.outputs.tag_cache_key }}

  summary:
    runs-on: ubuntu-latest
    needs: [fetch-clio-tag, build-binary, build-and-push-base, build-and-push-envt, build-and-push-slim]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          PRERELEASE_INFO=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_INFO=" (Pre-release)"
          fi
          echo "**Clio Version:** \`${{ needs.fetch-clio-tag.outputs.tag }}\`$PRERELEASE_INFO" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Base (clio)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          LATEST_TAG=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            LATEST_TAG="<br>\`${{ env.DOCKER_IMAGE_BASE }}:latest\`"
          fi
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_BASE }}:${{ needs.fetch-clio-tag.outputs.tag }}\`$LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          GHCR_LATEST_TAG=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            GHCR_LATEST_TAG="<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}:latest\`"
          fi
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_BASE }}:${{ needs.fetch-clio-tag.outputs.tag }}\`$GHCR_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-base.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Envt (clio-envt)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          ENVT_LATEST_TAG=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            ENVT_LATEST_TAG="<br>\`${{ env.DOCKER_IMAGE_ENVT }}:latest\`"
          fi
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_ENVT }}:${{ needs.fetch-clio-tag.outputs.tag }}\`$ENVT_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          ENVT_GHCR_LATEST_TAG=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            ENVT_GHCR_LATEST_TAG="<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_ENVT }}:latest\`"
          fi
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_ENVT }}:${{ needs.fetch-clio-tag.outputs.tag }}\`$ENVT_GHCR_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-envt.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Slim (clio-slim)" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          SLIM_LATEST_TAG=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            SLIM_LATEST_TAG="<br>\`${{ env.DOCKER_IMAGE_SLIM }}:latest\`"
          fi
          echo "| Docker Hub | \`${{ env.DOCKER_IMAGE_SLIM }}:${{ needs.fetch-clio-tag.outputs.tag }}\`$SLIM_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          SLIM_GHCR_LATEST_TAG=""
          if [ "${{ needs.fetch-clio-tag.outputs.is_prerelease }}" != "true" ]; then
            SLIM_GHCR_LATEST_TAG="<br>\`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}:latest\`"
          fi
          echo "| GHCR | \`${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_SLIM }}:${{ needs.fetch-clio-tag.outputs.tag }}\`$SLIM_GHCR_LATEST_TAG |" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.build-and-push-slim.result }}" >> $GITHUB_STEP_SUMMARY
