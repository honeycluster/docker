# Build from src/scylla: docker compose build
# Entrypoint ENV: SCYLLA_* (see scripts/entrypoint.sh)
services:
  scylla:
    build:
      context: .
      dockerfile: images/base.dockerfile
    container_name: scylla
    restart: unless-stopped
    environment:
      - SCYLLA_SUPER_USERNAME=calvin
      - SCYLLA_SUPER_PASSWORD=pass
      - SCYLLA_KEYSPACE=clio
      - SCYLLA_KEYSPACE_USERNAME=clio-cqlsh
      - SCYLLA_KEYSPACE_PASSWORD=password
      # Listen on all interfaces so Clio (and other containers) can connect
      - SCYLLA_LISTEN_ADDRESS=0.0.0.0
      - SCYLLA_RPC_ADDRESS=0.0.0.0
      # Required when rpc_address is 0.0.0.0; use this container's fixed IP
      - SCYLLA_BROADCAST_ADDRESS=172.30.0.10
      - SCYLLA_BROADCAST_RPC_ADDRESS=172.30.0.10
    labels:
      - "com.docker.compose.project=simulate"
      - "com.docker.compose.service=scylla"
      - "description=ScyllaDB Sample Service"
    ports:
      - "9042:9042"
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -u \"${SCYLLA_SUPER_USERNAME:-cassandra}\" -p \"${SCYLLA_SUPER_PASSWORD:-cassandra}\" -e 'describe cluster' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      simulation-net:
        ipv4_address: 172.30.0.10
