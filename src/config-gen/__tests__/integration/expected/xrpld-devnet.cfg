# This is the configuration for rippled.
# Do not edit by hand; it is generated from an envsubst template.
# Source defaults from: scripts/config/defaults.sh

[server]
port_peer
port_rpc
port_wss
port_grpc
port_rpc_admin_local
port_wss_admin_local


[port_peer]
port = 51235
ip = 0.0.0.0
protocol = peer

[port_rpc]
port = 51234
ip = 0.0.0.0
protocol = http

[port_wss]
port = 6005
ip = 0.0.0.0
protocol = ws

[port_grpc]
port = 50051
ip = 0.0.0.0
secure_gateway = 127.0.0.1
admin = 127.0.0.1

[port_rpc_admin_local]
port = 5005
ip = 0.0.0.0
protocol = http
admin = 127.0.0.1

[port_wss_admin_local]
port = 6006
ip = 0.0.0.0
protocol = ws
admin = 127.0.0.1


[debug_logfile]
/opt/xrpl/log/debug.log


[fetch_depth]
full

[ledger_history]
512

[ssl_verify]
1

[sntp_servers]
pool.ntp.org

[rpc_allow_remote]
1

[node_db]
type = NuDB
path=/opt/xrpl/db/nudb
advisory_delete=0
online_delete=512

[database_path]
/opt/xrpl/db/nudb


[rpc_startup]
{ "command": "log_level", "severity": "info" }


[peer_private]
0


[validators_file]
/opt/xrpl/etc/validators.txt

[network_id]
devnet

[ips]
s.devnet.rippletest.net 51235


