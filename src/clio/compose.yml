# When used in simulate stack: CASSANDRA_CONTACT_POINTS=172.30.0.10 (DB), ETL_SOURCE_IP=172.30.0.3 (xrpld). Same network, no service-name resolution.
services:
  clio:
    depends_on:
      - scylla
      - xrpld
    build:
      context: .
      dockerfile: ./images/envt.dockerfile
    container_name: clio
    restart: unless-stopped
    environment:
      - CASSANDRA_CONTACT_POINTS=172.30.0.10
      - CASSANDRA_PORT=9042
      - CASSANDRA_KEYSPACE=clio
      - CASSANDRA_USERNAME=clio-cqlsh
      - CASSANDRA_PASSWORD=password
      - ETL_SOURCE_IP=172.30.0.3
      - ETL_SOURCE_WS_PORT=6005
      - ETL_SOURCE_GRPC_PORT=50051
    labels:
      - "com.docker.compose.project=simulate"
      - "com.docker.compose.service=clio-server"
      - "description=Clio Server Image"
    ports:
      - "51233:51233"
    healthcheck:
      test: [ "CMD", "clio_server", "info" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      simulation-net:
        ipv4_address: 172.30.0.2
