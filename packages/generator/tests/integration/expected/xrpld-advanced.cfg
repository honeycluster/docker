[debug_logfile]
/var/log/xrpld/debug.log

[database_path]
/var/lib/xrpld/db

[ssl_verify]
1

[node_size]
medium

[ledger_history]
512

[fetch_depth]
full

[peer_private]
0

[network_id]
0

[peers_max]
21

[sntp_servers]
pool.ntp.org

[rpc_startup]
{"command":"log_level","severity":"warning"}

[overlay]
ip_limit=5
max_unknown_time=300
connect_timeout=15

[transaction_queue]
