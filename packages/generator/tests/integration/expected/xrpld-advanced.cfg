port = 51235
ip = 0.0.0.0
protocol = peer

[port_rpc]
port = 5005
ip = 0.0.0.0
protocol = http,https

[port_rpc_admin_local]
port = 5006
ip = 127.0.0.1
admin = 127.0.0.1
