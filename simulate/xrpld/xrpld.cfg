# This is the configuration for xrpld.
# Do not edit by hand, as this is handled by the ansible role

[server]
port_peer
port_rpc
port_wss
port_grpc
port_rpc_admin_local
port_wss_admin_local

[port_peer]
port = 52000
ip = 0.0.0.0
protocol = peer

[port_rpc]
port = 5400
ip = 0.0.0.0
protocol = http,https

[port_wss]
port = 6400
ip = 0.0.0.0
protocol = ws,wss

[port_grpc]
port = 51000
ip = 0.0.0.0
secure_gateway = 127.0.0.1
admin = 127.0.0.1

[port_rpc_admin_local]
port = 5300
ip = 0.0.0.0
protocol = http
admin = 127.0.0.1

[port_wss_admin_local]
port = 6300
ip = 0.0.0.0
protocol = ws
admin = 127.0.0.1

[debug_logfile]
/random/volume/path/log/xrpl.log

[fetch_depth]
full

[ledger_history]
256

[ssl_verify]
0

[sntp_servers]
pool.ntp.org

[rpc_allow_remote]
1

[node_db]
type = NuDB
path = /random/volume/path/nudb/node
online_delete = 512
advisory_delete = 0

[database_path]
/random/volume/path/nudb

[rpc_startup]
{'command': 'log_level', 'severity': 'error'}

[peer_private]
0

[ips]
r.ripple.com 51235
