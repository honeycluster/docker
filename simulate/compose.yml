# Root compose file for simulation/test environment
# Includes all stack components for testing
#
# Usage (from simulate directory):
#   ./up.sh up              # Start services (recommended - loads credentials automatically)
#   ./up.sh down            # Stop services
#   ./up.sh ps              # List services

name: nodekit-simulate

include:
  # Simulate ScyllaDB cluster
  - path: ./scylla/compose.yml
  # Simulate Rippled application stack
  - path: ./xrpld/compose.yml
  # Simulate Clio application stack
  - path: ./clio/compose.yml

# Shared network for all stack services (same subnet, static IPs).
networks:
  nodekit-simulate-net:
    name: nodekit-simulate-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 10.201.0.0/16
          gateway: 10.201.0.1

# Named volumes for data persistence (avoids permission issues with external volumes)
volumes:
  scylla-data:
  xrpld-data:
  clio-data:
