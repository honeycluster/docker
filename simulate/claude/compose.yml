# Root compose file for worker environment
# Spins up Claude Code worker containers on their own subnet
#
# Usage (from project root):
#   WORKSPACE_DIR="$(pwd)" docker-compose -f simulate/claude/compose.yml up --build
#   docker-compose -f simulate/claude/compose.yml down

name: nodekit-simulate-claude

x-claude-worker: &claude-worker
  build:
    context: .
    args:
      TZ: ${TZ:-UTC}
  labels:
    - 'com.docker.compose.project=nodekit-simulate-claude'
    - 'description=Claude Code devcontainer worker'
  volumes:
    - ${WORKSPACE_DIR:-.}:/workspace
    - nodekit-commandhistory:/commandhistory
  command: ["sleep", "infinity"]
  stdin_open: true
  tty: true

services:
  nodekit-claude-1:
    <<: *claude-worker
    container_name: nodekit-claude-1
    volumes:
      - ${WORKSPACE_DIR:-.}:/workspace
      - nodekit-commandhistory:/commandhistory
      - nodekit-claude-1-config:/home/vscode/.claude
    networks:
      nodekit-simulate-net:
        ipv4_address: 10.200.0.11

networks:
  nodekit-simulate-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/16
          gateway: 10.200.0.1

# Named volumes for data persistence
volumes:
  nodekit-commandhistory:
  nodekit-claude-1-config:
